title: Transient Denial of Service Vulnerabilities in Qualcomm Snapdragon 8s Gen 3 (SM8635)'s 5G Baseband
description: Multiple transient denial of service (DoS) vulnerabilities can be triggered in Qualcomm Snapdragon 8s Gen 3 (SM8635)'s 5G baseband (Snapdragon X70 5G modem) using unauthenticated downlink radio resource control (RRC) setup messages without requiring user interaction.